[project]
name = "kitchen-sink-rights-demo"
version = "0.1.0"
requires-python = ">=3.11"
# A pyproject.toml OVERRIDES the container runtime's default packages, so the
# app's dependencies must be declared explicitly. streamlit >= 1.53.1 is
# required for restricted caller's rights. Packages are resolved from the
# built-in Snowflake PyPI mirror (snowflake.snowpark.pypi_shared_repository)
# attached to the app — no external access integration or internet needed.
dependencies = [
    "snowflake-snowpark-python",
    "streamlit>=1.53.1",
]
