name: Deploy to staging

# On merge to main, deploy the app to the staging environment. Staging DATA is
# refreshed from prod on a schedule (refresh-staging), not on every merge — this
# workflow promotes the app CODE.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SF_USER: ${{ secrets.SNOWFLAKE_USER }}
      KEY: ${{ github.workspace }}/key.p8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: pip install --upgrade snowflake-cli

      - name: Write deployer key
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > "$KEY"
          chmod 600 "$KEY"

      - name: Deploy app to staging
        working-directory: app
        run: |
          snow streamlit deploy rights_demo --replace \
            --temporary-connection --account "$SF_ACCOUNT" --user "$SF_USER" \
            --authenticator SNOWFLAKE_JWT --private-key-file "$KEY" \
            --role KS_APP_STAGING --env target_db=KITCHEN_SINK_STAGING
          snow sql --temporary-connection --account "$SF_ACCOUNT" --user "$SF_USER" \
            --authenticator SNOWFLAKE_JWT --private-key-file "$KEY" \
            -q "USE ROLE KS_APP_STAGING; ALTER STREAMLIT KITCHEN_SINK_STAGING.APPS.KITCHEN_SINK_RIGHTS_DEMO SET ARTIFACT_REPOSITORIES = ('snowflake.snowpark.pypi_shared_repository'); GRANT USAGE ON STREAMLIT KITCHEN_SINK_STAGING.APPS.KITCHEN_SINK_RIGHTS_DEMO TO ROLE KS_STREAMLIT_VIEWER;"
